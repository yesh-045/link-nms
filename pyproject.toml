[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "link-npm"
version = "0.1.0"
description = "LINK – Lightweight Internet Network Keeper: continuous network performance monitor"
authors = [{ name = "Yeshwanth", email = "yeshw@537.com" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "typer>=0.12.3",
  "flask>=3.0.3",
  "speedtest-cli>=2.1.3",
  "schedule>=1.2.1",
  "python-dateutil>=2.9.0.post0",
  "pydantic>=2.8.2",
  "requests>=2.32.3",
  "rich>=13.7.1",
  "colorlog>=6.8.2",
]

[project.scripts]
link = "link.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["link*"] 